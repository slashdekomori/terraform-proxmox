---
- name: Build Debian 13 template
  hosts: proxmox
  gather_facts: false
  vars:
    distro: debian13
    image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    template_name: debian13-template
    template_id_key: debian13_template_id
  roles:
    - golden_image
